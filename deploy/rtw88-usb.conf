# RTL8822BU (rtw88) 在 Jetson Orin NX 上的稳定性配置
#
# 装到 /etc/modprobe.d/rtw88-usb.conf，然后 `modprobe -r rtw_8822bu` +
# `modprobe rtw_8822bu` 生效（或直接重启）。
#
# 背景：这块网卡原样驱动下，连加密的 5GHz 网络会让整机 hard lockup，约 120 秒后
# 被 AON 看门狗复位，dmesg 只留下 `PMC reset source: BCCPLEXWDT`，内核连日志都
# 写不进盘。以下三条是逐个实测出来的。

# 不切 USB 3.0 SuperSpeed。驱动自己的注释写着「切 USB 3 会干扰 2.4 GHz」；
# 在 tegra-xhci 上 SuperSpeed 的 URB 处理也是卡死的高发点。
# 注意：这个开关只能阻止驱动主动切模式，不能让已经以 SuperSpeed 枚举的设备降速
#（重启后 lsusb -t 仍是 5000M）。真要跑 USB 2.0 得物理换口。
options rtw_usb switch_usb_mode=N

# 不进深度省电。LPS 进出走 USB 控制传输，一旦失败固件状态机就卡住，
# 之后要下发指令的那条通道就是死的。
options rtw_core disable_lps_deep=Y

# 强制关掉 RX DMA 聚合 —— 解决 5GHz WPA 握手锁死的关键一项。
# 需要先给驱动源码打补丁（deploy/apply-rtw88-rxagg-patch.py），
# 原版 rtw88 没有这个参数，配了也会被 modprobe 报 unknown parameter。
options rtw_usb disable_rx_agg=Y
