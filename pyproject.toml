[project]
name = "go2"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "colorama>=0.4.6",
    "osqp>=1.1.3",
    "pynput>=1.8.2",
    "unitree-sdk2py",
]

[tool.uv.sources]
unitree-sdk2py = { path = "unitree_sdk2_python", editable = true }

# 文本控制用的本机模型。单独成组是因为 mlx 只有 Apple Silicon 能装，
# 放进主依赖会让 Linux / 真机环境装不上。
#     uv sync --extra llm
[project.optional-dependencies]
llm = ["mlx-lm>=0.31"]

[dependency-groups]
sim = [
    "mujoco>=3.17.0",
    "pygame>=2.6.1",
]
