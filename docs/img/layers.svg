<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <rect width="860" height="500" fill="#fcfcfb"/>

  <!-- ===== 同心框：三层是包含关系 ===== -->
  <rect x="40" y="48" width="486" height="404" rx="14" fill="#f4f4f1" stroke="#d6d6d1" stroke-width="1.5"/>
  <text x="64" y="80" font-size="17" font-weight="600" fill="#1a1a1a">Go2Robot</text>
  <text x="66" y="100" font-size="12.5" fill="#6b6b66">本体层 · 唯一对外入口，不写算法</text>

  <rect x="64" y="116" width="438" height="316" rx="12" fill="#ffffff" stroke="#d9d9d4" stroke-width="1.5"/>
  <text x="88" y="146" font-size="16" font-weight="600" fill="#1a1a1a">Go2Controller</text>
  <text x="90" y="165" font-size="12.5" fill="#6b6b66">控制层 · 500 Hz 回路、解析 IK、步态相位</text>

  <rect x="88" y="180" width="390" height="230" rx="10" fill="#faf9f7" stroke="#ddd9d2" stroke-width="1.5"/>
  <text x="110" y="210" font-size="15.5" font-weight="600" fill="#1a1a1a">HighLevelController</text>
  <text x="112" y="229" font-size="12.5" fill="#6b6b66">动作层 · 只关心「做个什么动作」</text>

  <g font-size="12" fill="#3a3a36">
    <text x="110" y="258">前进 / 横移 / 转身</text>
    <text x="110" y="278">蹲下 / 起立 / 平衡站</text>
    <text x="110" y="298">跳跃（bio / mech）</text>
    <text x="288" y="258">点头 / 侧倾 / 平移</text>
    <text x="288" y="278">原地踏步</text>
    <text x="288" y="298">动作序列编排</text>
  </g>

  <!-- ===== 右侧：每层碰什么 ===== -->
  <g font-size="12.5">
    <rect x="566" y="48" width="254" height="104" rx="10" fill="#ffffff" stroke="#dcdcd7"/>
    <text x="584" y="72" font-size="13" font-weight="600" fill="#1a1a1a">robot.controller</text>
    <text x="584" y="93" fill="#55554f">持有 DDS 参与者</text>
    <text x="584" y="112" fill="#55554f">rt/lowstate　rt/lowcmd</text>
    <text x="584" y="131" fill="#55554f">rt/sportmodestate</text>

    <rect x="566" y="168" width="254" height="104" rx="10" fill="#ffffff" stroke="#dcdcd7"/>
    <text x="584" y="192" font-size="13" font-weight="600" fill="#1a1a1a">.high_level</text>
    <text x="584" y="213" fill="#55554f">只管发关节目标角</text>
    <text x="584" y="232" fill="#55554f">不知道 DDS 存在</text>
    <text x="584" y="251" fill="#9a9a94">仿真 / 真机同一套</text>

    <rect x="566" y="288" width="254" height="124" rx="10" fill="#fdf6f4" stroke="#e4c4bb"/>
    <text x="584" y="312" font-size="13" font-weight="600" fill="#b5432f">four asserts</text>
    <text x="584" y="333" fill="#55554f">controller 是 Go2Controller</text>
    <text x="584" y="352" fill="#55554f">high_level 是 HighLevelController</text>
    <text x="584" y="371" fill="#55554f">挂在 controller.__dict__ 里</text>
    <text x="584" y="390" fill="#55554f">high_level 指回同一个实例</text>
  </g>

  <!-- 连线 -->
  <path d="M520 96 H548" stroke="#c0c0ba" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M520 220 H548" stroke="#c0c0ba" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M520 350 H548" stroke="#c0c0ba" stroke-width="1.5" stroke-dasharray="3 3"/>

  <text x="40" y="482" font-size="11.5" fill="#9a9a94">任何一条断言不成立就抛异常 —— 防止哪天被「拍平」成兄弟属性</text>
</svg>
