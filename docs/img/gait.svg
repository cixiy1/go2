<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <rect width="860" height="490" rx="10" fill="#fcfcfb"/>
  <text x="40" y="36" font-size="17" font-weight="600" fill="#1a1a1a">谁跟谁同相，决定它跑起来像什么</text>
  <text x="40" y="58" font-size="12.5" fill="#6b6b66">深色 = 支撑相（脚在地上），浅色 = 摆动相（脚在跨步）</text>

  <!-- ================= mech ================= -->
  <text x="100" y="96" font-size="13.5" font-weight="600" fill="#2c5f8a">mech　对角小跑</text>
  <text x="330" y="96" font-size="11.5" fill="#8a8a84">周期 0.50s　占空比 0.50　抬脚 6cm　步幅上限 12cm</text>

  <g>
    <rect x="160" y="110" width="620" height="20" fill="#f0ede7"/>
    <rect x="160" y="140" width="620" height="20" fill="#f0ede7"/>
    <rect x="160" y="170" width="620" height="20" fill="#f0ede7"/>
    <rect x="160" y="200" width="620" height="20" fill="#f0ede7"/>

    <rect x="160" y="110" width="310" height="20" fill="#3a3a36"/>
    <rect x="160" y="140" width="310" height="20" fill="#3a3a36"/>
    <rect x="470" y="170" width="310" height="20" fill="#3a3a36"/>
    <rect x="470" y="200" width="310" height="20" fill="#3a3a36"/>
  </g>

  <g font-size="12" fill="#3a3a36" text-anchor="end">
    <text x="148" y="125">FL</text>
    <text x="148" y="155">RR</text>
    <text x="148" y="185">FR</text>
    <text x="148" y="215">RL</text>
  </g>
  <g font-size="10.5" fill="#a8a8a2">
    <text x="788" y="125">同相</text>
    <text x="788" y="155">同相</text>
  </g>

  <!-- ================= bio ================= -->
  <text x="100" y="256" font-size="13.5" font-weight="600" fill="#b5432f">bio　横向序列疾驰</text>
  <text x="330" y="256" font-size="11.5" fill="#8a8a84">周期 0.44s　占空比 0.55　抬脚 7.5cm　步幅上限 10.5cm</text>

  <!-- 相位差标注（独立一行，不压文字） -->
  <line x1="160" y1="276" x2="234" y2="276" stroke="#c9c4ba" stroke-width="1"/>
  <line x1="160" y1="271" x2="160" y2="281" stroke="#c9c4ba" stroke-width="1"/>
  <line x1="234" y1="271" x2="234" y2="281" stroke="#c9c4ba" stroke-width="1"/>
  <text x="197" y="271" font-size="10.5" fill="#8a8a84" text-anchor="middle">12%</text>

  <line x1="234" y1="276" x2="470" y2="276" stroke="#c9c4ba" stroke-width="1"/>
  <line x1="470" y1="271" x2="470" y2="281" stroke="#c9c4ba" stroke-width="1"/>
  <text x="352" y="271" font-size="10.5" fill="#8a8a84" text-anchor="middle">前后两组错开 38%</text>

  <g>
    <rect x="160" y="292" width="620" height="20" fill="#f0ede7"/>
    <rect x="160" y="322" width="620" height="20" fill="#f0ede7"/>
    <rect x="160" y="352" width="620" height="20" fill="#f0ede7"/>
    <rect x="160" y="382" width="620" height="20" fill="#f0ede7"/>

    <!-- RL 0-0.55 -->
    <rect x="160" y="292" width="341" height="20" fill="#b5432f"/>
    <!-- RR 0.12-0.67 -->
    <rect x="234" y="322" width="341" height="20" fill="#b5432f"/>
    <!-- FL 0.50-1.05（跨周期） -->
    <rect x="470" y="352" width="310" height="20" fill="#b5432f"/>
    <rect x="160" y="352" width="31" height="20" fill="#b5432f"/>
    <!-- FR 0.62-1.17（跨周期） -->
    <rect x="564" y="382" width="216" height="20" fill="#b5432f"/>
    <rect x="160" y="382" width="105" height="20" fill="#b5432f"/>
  </g>

  <g font-size="12" fill="#3a3a36" text-anchor="end">
    <text x="148" y="307">RL</text>
    <text x="148" y="337">RR</text>
    <text x="148" y="367">FL</text>
    <text x="148" y="397">FR</text>
  </g>
  <g font-size="10.5" fill="#c8a49a">
    <text x="788" y="367">跨周期</text>
    <text x="788" y="397">跨周期</text>
  </g>

  <!-- 时间轴 -->
  <line x1="160" y1="418" x2="780" y2="418" stroke="#c9c4ba" stroke-width="1"/>
  <g font-size="10.5" fill="#a8a8a2" text-anchor="middle">
    <text x="160" y="433">0</text>
    <text x="315" y="433">0.25</text>
    <text x="470" y="433">0.5</text>
    <text x="625" y="433">0.75</text>
    <text x="780" y="433">1.0</text>
  </g>
  <text x="470" y="450" font-size="10.5" fill="#a8a8a2" text-anchor="middle">归一化周期</text>

  <!-- 结论 -->
  <text x="40" y="474" font-size="11" fill="#55554f">mech：任意时刻恰好 2 腿支撑。　bio：占空比 0.55 &gt; 相邻相位差 0.38，任意时刻至少 2 腿支撑。</text>
</svg>
