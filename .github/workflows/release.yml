name: Release APK

# 打 tag（v1.0.1 这种）就出一个 Release，客户端「检查更新」才拿得到东西。
# 没有这个 workflow，App 里那个按钮只会永远显示「仓库还没发布过 Release」。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 版本写死，别跟 stable 漂。CI 上跑的是 newer stable 时，Flutter 要求的
      # AGP 最低版本会比本项目的高（9.1.0 vs 9.1.1），构建立刻失败；而且出包
      # 的引擎版本和本地验证过的不一致，出问题分不清是谁的锅。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Run tests
        run: flutter test

      # 固定签名。这一条不做的话，每次 CI 生成的 debug 密钥都不同，用户装了
      # 旧版之后**无法覆盖安装**新版 —— 系统会报「应用未安装」。
      # 密钥怎么生成、怎么塞进 Secrets，见 flutter-client/docs/android-signing.md。
      - name: Restore signing keystore
        working-directory: .
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES_BASE64: ${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=未配置固定签名::缺少 ANDROID_KEYSTORE_BASE64，本次回退 debug 签名，用户无法覆盖安装"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > flutter-client/android/release.jks
          printf '%s' "$KEY_PROPERTIES_BASE64" | base64 -d > flutter-client/android/key.properties
          echo "已从 Secrets 还原固定签名密钥"

      # 单架构包：19 MB，比通用包小一半多。真机都是 arm64。
      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Print APK signer certificate
        working-directory: .
        run: |
          APK=flutter-client/build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk go2-remote-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: go2-remote-*.apk
          generate_release_notes: true
